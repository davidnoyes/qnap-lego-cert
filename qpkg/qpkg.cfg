# QDK package definition. Fields follow QDK 2.5.3's template (shared/template/qpkg.cfg).

QPKG_NAME="LegoCert"
QPKG_DISPLAY_NAME="LegoCert (Let's Encrypt for QTS)"
QPKG_VER="0.5.3"
QPKG_AUTHOR="David Noyes"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Keeps the QTS web certificate valid: lego (Cloudflare DNS-01) renews it, it is installed into stunnel, and problems are reported to Notification Center."

# Late in the start order: network and shares should be up first.
QPKG_RC_NUM="190"

# Called with start/stop at boot/shutdown and when the app is toggled in App Center.
QPKG_SERVICE_PROGRAM="legocert.sh"

# Settings page (shared/ui/index.cgi, linked into QTS's cgi-bin by legocert.sh start).
# Opened from App Center; administrators only (also enforced by the page itself).
QPKG_WEBUI="/cgi-bin/qpkg/LegoCert/index.cgi"
QPKG_VISIBLE="1"
# Open the page on QTS's own web port. Without this (and with no QPKG_WEB_PORT)
# App Center links to the separate Web Server port (80), which is usually off.
# Same as Tailscale's QPKG; legocert.sh start also records the actual QTS ports.
QPKG_USE_PROXY="1"
# Open in a window on the QTS desktop, like QNAP's own apps (not a new browser tab).
# Size is the window's inner size; QTS caps it at 1178x600. The page allows being
# framed by QTS itself (CSP frame-ancestors 'self').
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1100"
QPKG_DESKTOP_APP_WIN_HEIGHT="600"

# Holds the Cloudflare token: kept across upgrades (relative to the install dir).
QPKG_CONFIG="legocert.conf"

QTS_MINI_VERSION="5.0.0"

# start,stop timeouts in seconds. start only edits cron and backgrounds a check.
QPKG_TIMEOUT="30,30"

# Not signed: QNAP code signing is only available inside QNAP. Installing needs
# App Center > Settings > "Allow installation of applications without a valid
# digital signature" (see README).
