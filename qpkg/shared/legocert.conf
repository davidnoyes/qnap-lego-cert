# LegoCert configuration (<install dir>/legocert.conf). Must be root:root 0600.
# Read as KEY=VALUE data, never executed: one setting per line, no trailing
# comments. Unknown keys are an error. Kept across app upgrades (QPKG_CONFIG).

# Name the QTS web UI is reached by, e.g. nas.example.com (set in the settings page).
DOMAIN=

# ACME account contact.
EMAIL=

# Cloudflare API token (starts cfut_): Zone > DNS > Edit + Zone > Zone > Read,
# limited to ONE zone and the home IP address. How to create it, and how to
# limit it to just the NAS's name: docs/cloudflare-token.md in the source repo.
# Check it with: ./renew.sh --check-token
# Optionally split it: DNS:Edit token here, Zone:Read token for the same zone
# in CLOUDFLARE_ZONE_API_TOKEN.
CLOUDFLARE_DNS_API_TOKEN=
#CLOUDFLARE_ZONE_API_TOKEN=

# Optional overrides (defaults shown).
# ACME server: lego shortcode or ACME directory URL.
#ACME_SERVER=letsencrypt
# Resolvers for lego's DNS lookups, bypassing the LAN resolver's rewrites.
#DNS_RESOLVERS=1.1.1.1:53,1.0.0.1:53
# QTS HTTPS port; by default read from QTS's own settings.
#HTTPS_PORT=443
