<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- LegoCert app icon, QTS 5 style: rounded tile, blue gradient, white glyph.
       Source for qpkg/icons/*.gif (scripts/make-icons.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21c3ee"/>
      <stop offset="1" stop-color="#1b5fe0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="148" height="148" rx="34" fill="url(#bg)"/>
  <path d="M6 40a34 34 0 0 1 34-34h80a34 34 0 0 1 34 34v18C112 74 48 74 6 58z" fill="url(#shine)"/>
  <!-- shield -->
  <path d="M80 28l40 15v29c0 26-17 46-40 56-23-10-40-30-40-56V43z" fill="#fff"/>
  <!-- padlock inside the shield -->
  <path d="M68 76v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#1b6fe3" stroke-width="7" stroke-linecap="round"/>
  <rect x="61" y="74" width="38" height="30" rx="6" fill="#1b6fe3"/>
  <circle cx="80" cy="86" r="4.5" fill="#fff"/>
  <rect x="78" y="88" width="4" height="9" rx="2" fill="#fff"/>
</svg>
