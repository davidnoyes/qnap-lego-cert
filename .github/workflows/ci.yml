name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Behaviour tests (busybox ash, QTS stubbed)
        run: make test

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build both packages with QDK
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: qpkg
          path: |
            qpkg/build/*.qpkg
            qpkg/build/*.md5
          retention-days: 14
