name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Behaviour tests (busybox ash, QTS stubbed)
        run: make test

  real-lego:
    # The behaviour tests use a fake lego. These run the REAL lego binary (the version
    # in tools/go.mod): its flags/variables, then LegoCert end to end against Pebble,
    # Let's Encrypt's test ACME server. They gate Dependabot's lego updates.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: lego flags and variables
        run: make lego-flags
      - name: End to end against Pebble
        run: make e2e

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build both packages with QDK
        run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: qpkg
          path: |
            qpkg/build/*.qpkg
            qpkg/build/*.md5
          retention-days: 14
