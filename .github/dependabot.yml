version: 2

updates:
  # lego, the ACME client shipped in the package. tools/go.mod only records its
  # version; scripts/fetch-lego.sh downloads that release. A new lego is a user-
  # visible change, so fix(deps) -> a patch release.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: daily
    allow:
      - dependency-name: github.com/go-acme/lego/v5
    commit-message:
      prefix: "fix(deps)"
    labels: [dependencies]

  # The QDK build image's base. Build tooling only: no release.
  - package-ecosystem: docker
    directory: /build-env
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]

  # Actions used by the workflows. Build tooling only: no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
